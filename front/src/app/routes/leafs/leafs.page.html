<h2>Les feuilles</h2>

<button (click)="onAddLeaf()">Ajouter une feuille</button>
<button (click)="chooseLeafImport()">Importer une feuille</button>
<button (click)="chooseDictionaryImport()">Importer un nouveau dictionnaire</button>

<div *ngFor="let leaf of leafs" class="leaf-item">
    #{{leaf.id}} - Feuille : {{ leaf.name }} - {{ leaf.aliasName }} v.{{leaf.version}} <a
        [routerLink]="'/editer-feuille/'+leaf.id">Editer</a>
</div>
